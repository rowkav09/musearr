; Process supervisor for the single-container "arr-style" Musearr image.
; Start order is advisory (priority=); actual dependency ordering between
; postgres -> migrate -> {api,worker,web,caddy} is enforced by
; migrate.sh (waits for postgres) and wait-and-exec.sh (waits for migrate's
; sentinel file), not by supervisord itself.

[supervisord]
nodaemon=true
user=root
silent=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/musearr/supervisord.pid

[program:postgres]
command=postgres -D /config/postgres/data
user=postgres
priority=10
autorestart=true
startsecs=3
stopsignal=INT
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:migrate]
command=/usr/local/bin/musearr/migrate.sh
directory=/app
user=musearr
priority=20
autorestart=false
startsecs=0
startretries=0
exitcodes=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:api]
command=/usr/local/bin/musearr/wait-and-exec.sh /run/musearr/migrate.done node apps/api/dist/index.js
directory=/app
user=musearr
priority=30
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:worker]
command=/usr/local/bin/musearr/wait-and-exec.sh /run/musearr/migrate.done node apps/worker/dist/index.js
directory=/app
user=musearr
priority=30
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:web]
command=/usr/local/bin/musearr/wait-and-exec.sh /run/musearr/migrate.done node apps/web/server.js
directory=/app
user=musearr
priority=40
autorestart=true
environment=PORT="3000",HOSTNAME="127.0.0.1"
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:caddy]
command=/usr/local/bin/musearr/wait-and-exec.sh /run/musearr/migrate.done caddy run --config /etc/musearr/Caddyfile --adapter caddyfile
directory=/app
user=musearr
priority=50
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0