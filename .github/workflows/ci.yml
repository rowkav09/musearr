name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: musearr/package-lock.json
      - run: npm ci
        working-directory: musearr
      - run: npm run check
        working-directory: musearr
      - run: npm test
        working-directory: musearr
      - run: npm run build
        working-directory: musearr
